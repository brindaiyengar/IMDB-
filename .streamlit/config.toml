[theme]
base = "light"
primaryColor = "#F5C518"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F2"
textColor = "#222222"
linkColor = "#8A6A00"
borderColor = "#E8E8E8"
showWidgetBorder = true
baseRadius = "4px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, system-ui, sans-serif"
headingFontWeights = 650
dataframeHeaderBackgroundColor = "#FAFAFA"

[theme.sidebar]
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F0F0EE"

[server]
runOnSave = false

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
